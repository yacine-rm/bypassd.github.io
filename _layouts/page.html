---
layout: default
---
<main class="site-main">
  {% include header.html active="about" %}

  <article class="page-content">
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="page-description">{{ page.description }}</p>
      {% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </article>

  {% include footer.html %}
</main>
