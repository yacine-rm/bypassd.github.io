title: "bypassd.cc"
home_title: "Blog | Yacine RM"
tagline: "Breaking things, finding bugs, and a curious mind."
description: "Security research, bug bounty write-ups, and notes by Yacine Rahmoun."
author:
  name: "Yacine Rahmoun"
  twitter: "yacynx"
  github: "yacine-rm"
  email: "bugs@bypassd.cc"

url: "https://bypassd.cc"
baseurl: ""
lang: "en"
timezone: "Europe/Paris"

permalink: "/:title/"
markdown: "kramdown"
highlighter: "rouge"

pagination:
  enabled: true
  per_page: 6

social:
  twitter: "https://twitter.com/yacynx"
  github: "https://github.com/yacine-rm"
  discord: ""
  rss: "/feed.xml"

collections:
  tabs:
    output: true
    permalink: "/:path/"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "_tabs"
      type: "tabs"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "README.md"
  - "vendor"

plugins:
  - "jekyll-feed"
  - "jekyll-sitemap"

feed:
  path: "feed.xml"

